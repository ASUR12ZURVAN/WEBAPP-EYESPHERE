{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyesphere - Create Account</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-image: url("{% static 'macro-eye-iris.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        /* Enhanced overlay for better form readability against the futuristic eye background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5));
            z-index: -1;
        }

        /* Darkish Bluish Create User Container */
        .create-container {
            background: linear-gradient(145deg, rgba(15, 25, 45, 0.95), rgba(10, 20, 40, 0.98));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(100, 150, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 
                0 15px 40px rgba(0, 20, 50, 0.6),
                0 5px 15px rgba(0, 30, 80, 0.3),
                inset 0 1px 0 rgba(150, 180, 255, 0.1);
            position: relative;
            overflow: hidden;
            margin-top: 50px;
            height: auto;
            max-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            animation: fadeInUp 1s ease-out;
        }

        .create-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 150, 255, 0.08), transparent);
            transition: left 0.8s ease;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }

        .create-header {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .create-header h1 {
            color: #e8f2ff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(100, 150, 255, 0.2);
        }

        .create-header p {
            color: rgba(200, 220, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 300;
        }

        /* Form Container */
        .form-container {
            display: flex;
            flex-direction: column;
        }

        .form-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .form-fields .form-group:last-child {
            grid-column: span 2;
        }

        /* Darkish Blue Form Styling */
        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(220, 235, 255, 0.9);
            font-weight: 500;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(20, 35, 60, 0.8);
            border: 2px solid rgba(80, 120, 200, 0.2);
            border-radius: 10px;
            color: #e8f2ff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(100, 150, 255, 0.5);
            background: rgba(25, 40, 70, 0.9);
            box-shadow: 0 0 15px rgba(100, 150, 255, 0.2);
            transform: translateY(-1px);
        }

        .form-group input::placeholder {
            color: rgba(180, 200, 240, 0.5);
            font-size: 0.85rem;
        }

        .input-icon {
            position: absolute;
            top: 32px;
            right: 12px;
            color: rgba(150, 180, 255, 0.6);
            transition: all 0.3s ease;
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        .form-group:focus-within .input-icon {
            color: #a0c4ff;
            transform: scale(1.1);
        }

        /* Darkish Blue Submit Button */
        .submit-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(145deg, rgba(40, 70, 120, 0.9), rgba(30, 55, 100, 0.95));
            border: 2px solid rgba(100, 150, 255, 0.3);
            border-radius: 10px;
            color: #e8f2ff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(30, 60, 120, 0.4);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(150, 180, 255, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(50, 80, 140, 1), rgba(40, 65, 120, 1));
            border-color: rgba(120, 170, 255, 0.5);
            box-shadow: 0 8px 25px rgba(30, 60, 120, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-icon {
            transition: transform 0.3s ease;
            width: 18px;
            height: 18px;
        }

        .submit-btn:hover .submit-icon {
            transform: translateX(3px);
        }

        /* Darkish Blue Error Messages */
        .error {
            background: linear-gradient(145deg, rgba(120, 30, 60, 0.2), rgba(100, 20, 50, 0.15));
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 100, 150, 0.4);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            color: #ffb3d1;
            font-weight: 500;
            font-size: 0.85rem;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-3px);
            }
            75% {
                transform: translateX(3px);
            }
        }

        /* Darkish Blue Signin Link */
        .signin-link {
            text-align: center;
            margin-top: 0.8rem;
            color: rgba(200, 220, 255, 0.7);
            font-size: 0.85rem;
        }

        .signin-link a {
            color: rgba(150, 200, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }

        .signin-link a:hover {
            color: #a0c4ff;
            background: rgba(50, 100, 180, 0.2);
            border-color: rgba(120, 170, 255, 0.4);
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Darkish Blue Floating Elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.05), transparent);
            animation: float 6s ease-in-out infinite;
        }

        .floating-circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 15%;
            left: 8%;
            animation-delay: 0s;
        }

        .floating-circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating-circle:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-15px) rotate(180deg);
                opacity: 0.2;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .create-container {
                margin-top: 70px;
                padding: 1.2rem 1.5rem;
                max-width: 95%;
                height: auto;
                max-height: calc(100vh - 90px);
            }

            .create-header h1 {
                font-size: 1.8rem;
            }

            .form-fields {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            .form-fields .form-group:last-child {
                grid-column: span 1;
            }
        }

        @media (max-width: 480px) {
            .create-container {
                margin-top: 70px;
                padding: 1rem 1rem;
                height: auto;
                max-height: calc(100vh - 90px);
            }

            .create-header h1 {
                font-size: 1.6rem;
            }

            .create-header {
                margin-bottom: 1rem;
            }
        }

        @media (max-height: 700px) {
            .create-header h1 {
                font-size: 1.6rem;
                margin-bottom: 0.2rem;
            }

            .create-header p {
                font-size: 0.8rem;
            }

            .create-header {
                margin-bottom: 1rem;
            }

            .form-group input {
                padding: 0.7rem 0.9rem;
            }

            .submit-btn {
                padding: 0.9rem 1.5rem;
            }
        }

        /* Very small screens */
        @media (max-height: 600px) {
            .create-container {
                height: calc(100vh - 70px);
                margin-top: 70px;
                padding: 1rem;
            }

            .create-header {
                margin-bottom: 0.8rem;
            }

            .form-fields {
                gap: 0.6rem;
                margin-bottom: 0.8rem;
            }

            .signin-link {
                margin-top: 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* Enhanced form animations for dark blue theme */
        .form-group {
            animation: slideInLeft 0.6s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.3s;
        }

        .form-group:nth-child(4) {
            animation-delay: 0.4s;
        }

        .form-group:nth-child(5) {
            animation-delay: 0.5s;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .submit-btn {
            animation: slideInUp 0.6s ease-out 0.6s both;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <!-- Floating background elements -->
    <div class="floating-elements">
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
    </div>

    <!-- Create User Container -->
    <div class="create-container">
        <div class="create-header">
            <h1>Create Account</h1>
            <p>Join Eyesphere for comprehensive eye care</p>
        </div>

        {% if errors %}
            <div class="error">
                {% for field, error_list in errors.items %}
                    <p><strong>{{ field }}:</strong> {{ error_list.0 }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="form-container">
            <form method="POST" action="/create-user/">
                {% csrf_token %}

                <div class="form-fields">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" placeholder="Enter your age" required min="0" max="100"
                            oninput="validateAgeInput(this)">
                    </div>

                    <div class="form-group">
                        <label for="ph_Number">Phone Number</label>
                        <input type="text" id="ph_Number" name="ph_Number" placeholder="Enter your phone number"
                            required maxlength="10" pattern="\d{10}" oninput="validatePhoneNumber(this)">
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="Enter your city" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account
                    <svg class="submit-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <div class="signin-link">
                Already have an account? <a href="{% url 'sign_in_user' %}">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        function validateAgeInput(input) {
            let value = parseInt(input.value);
            if (value <= 0) {
                input.value = 1;
            } 
            else if (value > 100) {
                input.value = 100;
            }
        }
        
        function validatePhoneNumber(input) {
            input.value = input.value.replace(/\D/g, '');
            if (input.value.length > 10) {
                input.value = input.value.slice(0, 10);
            }
        }
    </script>
</body>

</html>
