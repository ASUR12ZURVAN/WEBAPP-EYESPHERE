name: Ping Website Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping homepage
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" \
          https://netrascreen.in/
