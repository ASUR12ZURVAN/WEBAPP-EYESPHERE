name: Keep Render App Awake

on:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch: # optional, lets you trigger manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render website
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://netrascreen.in/
